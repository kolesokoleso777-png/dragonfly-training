<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let KEY='dfx_v1';
const DEF=()=>({voice:true,rate:1,voiceURI:'',marks:{},gender:'m',read:{},results:{},learned:{},lastExpress:[],demo:false,units:[],cardOv:{},unit:'kitchen',svc:{},reg:{},mix:{}});
let S=DEF();
function loadS(k){KEY=k;S=DEF();try{const r=localStorage.getItem(k);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
loadS('dfx_v1');
let persistWarned=false;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));try{syncProg();if(isMgr())saveORG();}catch(e){}return true;}catch(e){if(!persistWarned){persistWarned=true;alert('Память телефона заполнена: прогресс или карточки могут не сохраниться.');}return false;}};
const g=s=>s.replace(/\{la\}/g,S.gender==='f'?'ла':'л');
const PASS=75;

/* ---------- units / categories ---------- */
function kitchenUnit(){return {id:'kitchen',name:'Кухня',builtin:true,cats:(window.MENU?MENU.cats:[])};}
function barUnit(){return {id:'bar',name:'Бар',builtin:true,cats:(window.BAR?BAR.cats:[])};}
const UL=()=>(isMgr()||isStaff())?ORG.units:S.units;
const units=()=>[kitchenUnit()].concat((!isStaff()||can('bar'))?[barUnit()]:[]).concat(UL().filter(u=>!isStaff()||u.id==='kitchen_extra'||can('bar')));
const curUnit=()=>units().find(u=>u.id===S.unit)||kitchenUnit();
const allDishes=u=>u.cats.flatMap(c=>c.dishes.map(d=>Object.assign(d,{_cat:c.id,_unit:u.id})));
const rkey=(u,c)=>u.id+':'+c.id;
const partsOf=c=>{const n=c.dishes.length;return n?Math.ceil(n/10):0;};
function splitParts(c){const n=c.dishes.length,p=partsOf(c),out=[];let s=0;for(let i=0;i<p;i++){const sz=Math.floor(n/p)+(i<n%p?1:0);out.push(c.dishes.slice(s,s+sz));s+=sz;}return out;}
function passed(u,c){
  if(!c.dishes.length)return !!S.read[rkey(u,c)];
  const r=S.results[rkey(u,c)];if(!r)return false;
  for(let i=0;i<partsOf(c);i++){if(!(r.parts&&r.parts[i]>=PASS))return false;}return true;
}
function unlocked(u,i){if(S.demo||i===0||isMgr()||(isStaff()&&!can('exam')))return true;return passed(u,u.cats[i-1]);}
const cardKey=p=>p?String(p).replace(/^.*\//,'').replace(/\.jpg$/,''):null;
const CL={};
function loadCards(catId){
  if(CL[catId])return CL[catId];
  return CL[catId]=new Promise(res=>{const sc=document.createElement('script');sc.src='cards/'+catId+'.js';sc.onload=()=>res(true);sc.onerror=()=>{delete CL[catId];res(false);};document.head.appendChild(sc);});
}
const cardsReady=c=>c.dishes.every(d=>!d.card||(window.CARDS&&window.CARDS[cardKey(d.card)]));
function prefetchCards(){
  const cs=(window.MENU?MENU.cats:[]).concat(window.BAR?BAR.cats:[]).filter(c=>c.dishes.some(d=>d.card));let i=0;
  (function next(){if(i>=cs.length)return;const c=cs[i++];if(cardsReady(c))return next();loadCards(c.id).then(()=>setTimeout(next,600));})();
}
const cardOf=d=>S.cardOv[d.id]||(d.card&&window.CARDS&&window.CARDS[cardKey(d.card)])||null;

/* ---------- shell ---------- */

async function shrinkToData(file,max=640,q=.82){
  const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));

}

const HDR_EXACT=new Set(['ром','чай','вино','вина','джин','виски','водка','кофе','пиво','сидр','соки','шоты','фреш','бар','закуски','десерты','салаты','супы','горячее','холодное','sushi','roll','sashimi','salads','soups','wok','roti','desserts','dessert','drinks','wine','cocktails','tataki']);
const HDR_PRE=['коктейл','красн','бел','розов','игрист','шампан','текил','коньяк','бренди','ликер','лимонад','безалког','аперитив','дижестив','классик','авторск','закуск','напитк','крепк','портвейн','херес','вермут','настойк','смузи','минерал','сезонн','горяч','холодн','десерт','салат','суп','основн','appet','appit','robata','main','dim sum'];
function parseText(raw){
  let t=String(raw||'').replace(/\r/g,'').replace(/Рисунок\s*\d+/g,'').replace(/\t/g,' ');
  t=t.replace(/\s[—–-]?\s*\d[\d\s.,]*\s?(?:₸|тг|тенге|руб\.?|₽|kzt|\$|€)(?=\s|$|[,.;])/gi,'').replace(/\s[—–-]\s*\d[\d\s]{2,}\s*$/gm,'').replace(/\s[—–-]\s*$/gm,'');
  const raws=t.split('\n');
  const FIELD=/^(Состав|Ингредиенты|Компоненты|Подача|Подаётся|Подается|Бокал|Украшение|Декор|Описание)\b\s*[:–-]?\s*(.*)$/i;
  const SEP=/^(.{2,70}?)\s+[—–-]\s+(.+)$|^(.{2,60}?):\s+(\S.*)$/;
  const sepMatch=l=>{const m=l.match(SEP);if(!m)return null;if(/^(Сверху|Внутрь|Снаружи|Подача|Начинка|Основа|Украшается|Завершается|Поливается|Подаётся|Подается|Также|Затем|Далее|Рекомендуем|Рекомендую|В |На |С |Из |Для |При |После )/.test(m[1]||m[3]))return null;if(m[3]&&/[.,;]/.test(m[3]))return null;return m;};
  const hdrWords=l=>{const w=l.toLowerCase().replace(/[^а-яёa-z ]/g,'').split(/\s+/).filter(Boolean);return w.length>0&&w.length<=3&&w.some(x=>HDR_EXACT.has(x)||HDR_PRE.some(p=>x.startsWith(p)));};
  const isHeader=l=>{
    if(/^#+\s*\S/.test(l)||/^[=\-_*~]{2,}\s*\S.*\S\s*[=\-_*~]{2,}$/.test(l))return true;
    if(l.length>42||/[.;,]$/.test(l)||/\s[—–-]\s/.test(l)||(/:\s*\S/.test(l)))return false;
    if(/\d/.test(l)&&!/^#/.test(l))return false;
    if(/:$/.test(l)&&l.length<=40)return true;
    const caps=l===l.toUpperCase()&&/[А-ЯЁA-Z]{3}/.test(l);
    return caps||hdrWords(l);
  };
  const cleanHdr=l=>l.replace(/^#+\s*/,'').replace(/^[=\-_*~]{2,}\s*|\s*[=\-_*~]{2,}$/g,'').replace(/:$/,'').trim();
  const nice=s=>s===s.toUpperCase()?s.charAt(0)+s.slice(1).toLowerCase():s;
  // tokens
  const toks=[];let blank=true;
  raws.forEach(r=>{
    const l=r.replace(/^[\s•·▪●■*]+/,'').trim();
    if(!l){blank=true;return;}
    let k='T',m;
    if(FIELD.test(l)&&!isHeader(l))k='F';
    else if(isHeader(l))k='H';
    else if(sepMatch(l)&&!FIELD.test(l))k='E';
    toks.push({k,l,blank});blank=false;
  });
  // sections
  const secs=[];let sec={name:null,toks:[]};secs.push(sec);
  toks.forEach(tk=>{if(tk.k==='H'){sec={name:nice(cleanHdr(tk.l)),toks:[]};secs.push(sec);}else sec.toks.push(tk);});
  const cats=[];
  secs.forEach(sc=>{
    if(!sc.toks.length)return;
    const tl=sc.toks.filter(x=>x.k==='T');
    const listMode=tl.length>0&&tl.filter(x=>x.l.length<=70).length/tl.length>=0.7&&!tl.some(x=>x.l.length>110);
    const dishes=[];let curD=null;
    const mk=(name,body,unsure)=>{curD={id:uid(),name:name.trim(),desc:body||'',comp:[],accent:[],serving:'',card:null,_unsure:!!unsure,_hasBody:!!body};dishes.push(curD);return curD;};
    sc.toks.forEach(tk=>{
      if(tk.k==='E'){const m=sepMatch(tk.l);mk(m[1]||m[3],m[2]||m[4]);return;}
      if(tk.k==='F'){
        if(!curD)return;const m=tk.l.match(FIELD);const key=m[1].toLowerCase();
        if(/^подач|^подаё|^подае|^бокал|^украш|^декор/.test(key)){curD.serving=(curD.serving?curD.serving+'; ':'')+((/^бокал/.test(key)?'бокал: ':'')+m[2]).replace(/\.$/,'').trim();}
        else if(/^состав|^ингред|^компон/.test(key)){curD._compStr=m[2];}
        else curD.desc+=(curD.desc?'\n':'')+m[2];
        curD._hasBody=true;return;
      }
      // T line
      const long=tk.l.length>60||/[.!?]$/.test(tk.l);
      if(curD&&(/[.!?)]$/.test(tk.l)||tk.l.length>90)){curD.desc+=(curD.desc?'\n':'')+tk.l;curD._hasBody=true;return;}
      if(curD&&!curD._hasBody&&(long||(!listMode&&!tk.blank&&(/[,.]/.test(tk.l)||tk.l.length>40)))){curD.desc=tk.l;curD._hasBody=true;return;}
      if(curD&&curD._hasBody&&(long||(!listMode&&!tk.blank&&/[,.]/.test(tk.l)))&&!tk.blank){curD.desc+='\n'+tk.l;return;}
      if(curD&&curD._hasBody&&long&&tk.blank&&!listMode){curD.desc+='\n'+tk.l;return;}
      mk(tk.l,'',false);
    });
    // post-process entries
    const GEN=/^(лёд|лед|вода|сироп|сахар|соль|перец)$/i;
    dishes.forEach(d=>{
      let compStr=d._compStr||'';
      if(!compStr){
        const pm=d.name.match(/^(.+?)\s*\(([^)]{6,})\)\s*$/);
        if(pm){d.name=pm[1].trim();compStr=pm[2];}
      }
      if(!compStr&&d.desc){
        // inline "Подача:" inside desc
        const sm=d.desc.match(/(?:^|[.\s])(?:Подач[аи]|Подаётся|Подается|Бокал|Украшение|Декор)\s*[:–-]?\s*([^.\n]+)/i);
        if(sm&&!d.serving)d.serving=sm[1].trim();
        const first=d.desc.split('\n')[0].replace(/\s*(?:Подач|Бокал|Украшение|Декор)[^]*$/i,'').replace(/\.$/,'');
        const parts=first.split(/[,;]/).map(x=>x.trim()).filter(Boolean);
        if(parts.length>=3&&parts.every(p=>p.length<=45&&!/[.!?]\s+\S/.test(p)))compStr=first;
      }
      if(compStr){
        d.comp=compStr.split(/[,;]|\sи\s(?=[а-яё])/i).map(x=>x.replace(/\(.*?\)/g,'').replace(/\b\d+[\d.,]*\s*(?:мл|ml|г|гр|cl|см|шт|oz|dash|капл\w*)\b\.?/gi,'').replace(/\s{2,}/g,' ').replace(/^[-–—\s]+|[.\s]+$/g,'').trim()).filter(x=>x&&x.length<=50);
        d.accent=d.comp.filter(x=>!GEN.test(x)).slice(0,3);
      }
      if((!d.comp.length&&!listMode)||d.name.length>60)d._unsure=true;
      delete d._compStr;delete d._hasBody;
    });
    if(dishes.length)cats.push({id:uid(),name:sc.name||'Без раздела',info:[],dishes});
  });
  return cats;
}

/* ---------- EXAM ENGINE (без ИИ) ---------- */
const GEN_STEMS=new Set(['соус','масло','соуса','масла','свеже','мясо','рыба','сыр','подае','подач','украш','посып','полив','сверх','подаю','блюдо']);
const clean=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[‐‑‒–—−]/g,'-').replace(/[^а-яa-z0-9 \-]/g,' ');
const st5=w=>w.slice(0,5);
const stems=s=>clean(s).replace(/-/g,' ').split(/\s+/).filter(x=>x.length>2).map(st5);
/* ответ: все формы слов — дефис не важен: «фуа-гра», «фуа гра», «фуагра» дают одно и то же */
function ansInfo(ans){
  const words=clean(ans).split(/\s+/).filter(Boolean);const set=new Set();const flat=[];
  words.forEach(w=>{const parts=w.split('-').filter(Boolean);flat.push(...parts);set.add(st5(parts.join('')));parts.forEach(p=>set.add(st5(p)));});
  for(let i=0;i<flat.length-1;i++)set.add(st5(flat[i]+flat[i+1]));
  return {set,compact:flat.join('')};

/* ---------- прогресс ---------- */
function catScore(u,c){
  if(!c.dishes.length)return S.read[rkey(u,c)]?100:0;
  const r=S.results[rkey(u,c)];if(!r||!r.parts)return 0;
  const n=partsOf(c);let s=0;for(let i=0;i<n;i++)s+=Math.min(100,r.parts[i]||0);return s/n;
}
function kitchenPct(){const u=kitchenUnit();return u.cats.length?Math.round(u.cats.reduce((a,c)=>a+catScore(u,c),0)/u.cats.length):0;}
function servicePct(){const cs=SERVICE.cats;return Math.round(cs.reduce((a,c)=>a+Math.min(100,(S.svc&&S.svc[c.id])||0),0)/cs.length);}
const accOf=b=>{const m=S.mix&&S.mix[b];return m&&m.n?Math.round(m.ok/m.n*100):null;};
function barGroups(){
  const g={w:[],a:[],c:[]};
  [barUnit()].concat(ORG.units.filter(u=>u.id!=='kitchen_extra')).forEach(u=>u.cats.forEach(c=>{
    const t=lc((u.builtin?'':u.name+' ')+c.name);
    const k=/вин|wine|шампан|игрист|просекко|сомелье|саке|сакэ|умэсю|соджу|аперитив/.test(t)?'w':/коктейл|cocktail|лонгдринк|шот|авторск/.test(t)?'c':'a';
    g[k].push([u,c]);}));
  return g;
}
const avgCats=arr=>arr.length?Math.round(arr.reduce((a,[u,c])=>a+catScore(u,c),0)/arr.length):null;
function barPcts(){const g=barGroups();return {all:avgCats(g.w.concat(g.a,g.c)),w:avgCats(g.w),a:avgCats(g.a),c:avgCats(g.c)};}
const barCount=()=>{const g=barGroups();return g.w.length+g.a.length+g.c.length;};
function regPct(){const cs=regCats();if(!cs.length)return null;return Math.round(cs.reduce((a,c)=>a+Math.min(100,(S.reg&&S.reg[c.id])||0),0)/cs.length);}
function syncProg(){
  const s=myStaff();if(!s)return;
  const bp=barPcts();
  s.prog={k:kitchenPct(),b:bp.all,bw:bp.w,ba:bp.a,bc:bp.c,s:servicePct(),r:regPct(),mk:accOf('k'),mb:accOf('b'),ms:accOf('s'),mr:accOf('r'),t:Date.now()};s.last=Date.now();saveORG();
}

function buildMix(n){
  const P={};
  if(can('menu'))P.k=kitchenQs(60);
  if(can('bar')&&barDishes().length>=4)P.b=kitchenQs(60,'b');
  if(svcOn())P.s=shuffle(blockQsAvail('svc'));
  if(can('reg')&&regCats().length)P.r=shuffle(blockQsAvail('reg'));
  const keys=Object.keys(P).filter(k=>P[k].length);if(!keys.length)return [];
  const out=[];let last=null,cons=0;
  while(out.length<n&&keys.some(k=>P[k].length)){
    const av=keys.filter(k=>P[k].length);let b=rnd(av);
    if(av.length>1&&b===last&&Math.random()<.75)b=rnd(av.filter(k=>k!==last));
    let run=1+Math.floor(Math.random()*3);
    while(run-->0&&P[b].length&&out.length<n){
      if(b===last&&cons>=3)break;
      out.push(P[b].shift());cons=b===last?cons+1:1;last=b;
    }
  }

}

let Q=null;

function normQ(it){
  if(it.t==='tf')return {b:it.b,q:it.q,o:['Верно','Неверно'],ai:[it.a?0:1],multi:false,why:it.why};
  const idx=it.o.map((_,i)=>i),ord=shuffle(idx);

function startQuiz(o){

function renderQuiz(a){

  <div id="ops">${it.o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join('')}</div>
  ${it.multi?'<div class="row" style="margin-top:10px"><button class="pri" id="chk">Проверить</button></div>':''}

  const finish=()=>answer(opts);

    if(it.multi){Q.sel=Q.sel.includes(+b.dataset.i)?Q.sel.filter(x=>x!==+b.dataset.i):Q.sel.concat(+b.dataset.i);b.classList.toggle('sel',Q.sel.includes(+b.dataset.i));}

}
function answer(opts){
  const it=Q.items[Q.i];Q.answered=true;
  const good=Q.sel.length===it.ai.length&&Q.sel.every(x=>it.ai.includes(x));
  opts.forEach((b,i)=>{b.disabled=true;if(it.ai.includes(i))b.classList.add(Q.sel.includes(i)?'ok':'miss');else if(Q.sel.includes(i))b.classList.add('bad');});
  const m=Q.per[it.b]||{ok:0,n:0};m.n++;if(good){m.ok++;Q.ok++;Q.streak++;Q.maxStreak=Math.max(Q.maxStreak,Q.streak);Q.score+=10+Math.min(Q.streak,5)*2;}else Q.streak=0;Q.per[it.b]=m;
  const young=isYoung();try{if(navigator.vibrate)navigator.vibrate(good?15:[20,40,20]);}catch(e){}

  ${Q.auto?'':`<div class="row" style="margin-top:10px"><button class="pri" id="nx">${last?'Результат':'Дальше'}</button></div>`}`;

function renderQuizEnd(a){

/* ---------- ОБУЧЕНИЕ КОРОТКИМИ ШАГАМИ (тренировка, оценки не меняет) ---------- */
const LN=()=>(S.learn=S.learn||{pts:0,days:[],d:{}});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function learnStreak(){const days=new Set(LN().days);let n=0,t=Date.now();if(!days.has(dayKey(t)))t-=86400000;while(days.has(dayKey(t))){n++;t-=86400000;}return n;}
let L=null;
function learnPool(u,cats){const cs=cats||u.cats.filter((c,i)=>unlocked(u,i)&&c.dishes.length);return cs.flatMap(c=>c.dishes.filter(d=>d.comp&&d.comp.length>=2));}
function lnQs(d,u){
  const all=u.cats.flatMap(c=>c.dishes.map(x=>({x,c})));
  const mine=u.cats.find(c=>c.dishes.includes(d));
  const others=all.filter(o=>o.x!==d&&lc(o.x.name)!==lc(d.name));
  const allC=[...new Set(all.flatMap(o=>o.x.comp||[]))];
  const foreign=()=>shuffle(allC.filter(x=>x.length>2&&!hasItem(d,x)));
  const drink=u.id==='bar';
  const B=drink?'b':'k';
  const mk=(q,right,wrongs,why)=>{const w=[...new Set(wrongs)].filter(x=>x&&x!==right).slice(0,3);if(!right||w.length<3)return null;return normQ({q,o:[right].concat(w),a:0,why,b:B});};
  const first=t=>{const x=String(t||'').split(/[;.]/)[0].trim();return x.length>95?x.slice(0,92).replace(/\s+\S*$/,'')+'…':x;};
  const acc=d.accent&&d.accent.length>=2?d.accent:d.comp.slice(0,3);
  let used=null;
  const build={
    guess:()=>{const same=shuffle(others.filter(o=>o.c===mine).map(o=>o.x.name)),rest=shuffle(others.filter(o=>o.c!==mine).map(o=>o.x.name));
      return mk(`Гость просит: «Хочу, чтобы главным было: ${acc.join(', ')}». ${drink?'Какую позицию':'Какое блюдо'} предложите?`,d.name,same.concat(rest),`Это «${d.name}»: ${d.comp.join(', ')}.`);},
    comp:()=>{const pr=d.comp.filter(x=>x.length>2);const pick=rnd(pr.length?pr:d.comp);used=pick;
      return mk(`Что входит в «${d.name}»?`,pick,foreign(),`В «${d.name}»: ${d.comp.join(', ')}.`);},
    comp2:()=>{const pr=d.comp.filter(x=>x.length>2&&x!==used);if(!pr.length)return null;
      return mk(`А что из этого тоже входит в «${d.name}»?`,rnd(pr),foreign(),`В «${d.name}»: ${d.comp.join(', ')}.`);},
    serv:()=>{if(!d.serving||d.serving.length<4)return null;const r=first(d.serving);
      const ws=shuffle(others.map(o=>first(o.x.serving)).filter(x=>x&&x.length>3&&lc(x)!==lc(r)));
      return mk(`Как подаётся «${d.name}»?`,r,ws,`Подача: ${d.serving}`);},
    odd:()=>{if(d.comp.length<3)return null;const f=foreign()[0];if(!f)return null;
      return mk(`Что НЕ входит в «${d.name}»?`,f,shuffle(d.comp).slice(0,3),`В «${d.name}»: ${d.comp.join(', ')}. «${f}» там нет.`);}
  };
  const fmtB=d.accent&&d.accent.length>=2&&others.length>=3&&Math.random()<.35;
  const seq=fmtB?['guess','comp','serv','odd','comp2']:['comp','serv','odd','comp2','guess'];
  const out=[];for(const k of seq){if(out.length>=3)break;const q=build[k]();if(q)out.push(q);}
  return out.length>=2?out:null;

const lnScore=d=>{const r=LN().d[d.id];return r?({top:3,good:2,weak:0}[r.s]):-1;};

  const pool=shuffle(o.dishes).sort((a,b)=>lnScore(a)-lnScore(b));
  const items=[];for(const d of pool){if(items.length>=(o.n||6))break;const qs=lnQs(d,o.u);if(qs)items.push({d,qs});}
  if(items.length<1){alert('Для этого раздела пока нечем тренироваться: нужны позиции с ингредиентами (хотя бы 4).');return;}
  L=Object.assign({},o,{all:o.all||o.dishes,items,i:0,qi:0,phase:'card',pts:0,streak:0,maxStreak:0,right:[],res:[],answered:false,saved:false});
  view='learn';render();window.scrollTo(0,0);
}
function lnFinishDish(){
  const it=L.items[L.i],r=L.right,n=r.filter(Boolean).length;
  const st=(r.length===2&&n===2)?'top':(r.length===3&&n>=2)?'good':'weak';
  L.res.push({d:it.d,st});LN().d[it.d.id]={s:st,t:Date.now()};

function renderLearn(a){
  if(!L){view=homeView();return render();}

  <div id="ops">${q.o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join('')}</div><div id="fb"></div></div></div>`;

    if(good){L.streak++;L.maxStreak=Math.max(L.maxStreak,L.streak);L.pts+=10+Math.min(L.streak,5)*2;}else L.streak=0;
    try{if(navigator.vibrate)navigator.vibrate(good?15:[20,40,20]);}catch(e){}
    const young=isYoung();
    $('#fb').innerHTML=`<div class="note ${good?'good':'bad'}" style="margin-top:12px"><b>${good?(young?rnd(['Верно!','В точку!','Чётко!']):'Верно.'):(young?rnd(['Не совсем.','Почти.','Мимо.']):'Неверно.')}</b> ${esc(q.why||'')}</div><button class="pri big lnext" id="lnx">Дальше</button>`;
    $('#lnx').onclick=()=>{
      const r=L.right,n2=r.filter(Boolean).length;

  });
}
function renderLearnEnd(a){
  const ln=LN();
  if(!L.saved){L.saved=true;ln.pts=(ln.pts||0)+L.pts;const t=dayKey(Date.now());if(!ln.days.includes(t))ln.days.push(t);ln.days=ln.days.slice(-400);persist();}

/* ---------- РЕГЛАМЕНТ: загрузка текстом, автоматические «верно/неверно», свои вопросы ---------- */
const RG={raw:'',draft:null,err:'',form:null,open:null};
function parseReg(raw){
  const lines=String(raw).replace(/\r/g,'').split('\n').map(x=>x.trim());
  const secs=[];let curS=null;
  const mk=n=>{curS={id:uid(),name:n,items:[]};secs.push(curS);};
  const bullet=/^[-–—•*·▪✓□●]+\s*/;
  const nextLine=i=>{for(let j=i+1;j<lines.length;j++)if(lines[j])return lines[j];return '';};
  lines.forEach((ln,i)=>{
    if(!ln)return;
    let m;
    if((m=ln.match(/^#+\s*(.+)$/))){mk(m[1].trim());return;}
    if((m=ln.match(/^\d+[.)]\s+(\S.*)$/))&&ln.length<=70&&!/[.;,]$/.test(ln)){mk(m[1].trim());return;}
    const letters=ln.replace(/[^A-Za-zА-Яа-яЁё]/g,'');
    if(letters.length>=3&&letters===letters.toUpperCase()&&ln.length<=70){mk(ln.replace(/[:\s]+$/,''));return;}
    if(/:$/.test(ln)&&ln.length<=60&&!/[.;]$/.test(ln.slice(0,-1))){mk(ln.slice(0,-1));return;}
    const prevBlank=i===0||!lines[i-1];
    if(prevBlank&&ln.length<=45&&!/[.;,:!?]$/.test(ln)&&nextLine(i).length>ln.length&&!bullet.test(ln)){mk(ln);return;}
    if(!curS)mk('Общее');
    curS.items.push(ln.replace(bullet,'').replace(/^\d+(\.\d+)+[.)]?\s+/,m=>m).trim());
  });
  return secs.filter(s=>s.items.length);
}
const swapPairs=[[/\bнельзя\b/i,'можно'],[/\bможно\b/i,'нельзя'],[/\bзапрещено\b/i,'разрешено'],[/\bразрешено\b/i,'запрещено'],[/\bвсегда\b/i,'никогда'],[/\bникогда\b/i,'всегда'],[/\bне должен\b/i,'должен'],[/\bне должна\b/i,'должна'],[/\bобязательно\b/i,'по желанию'],[/\bдо\b(?=\s+\d)/i,'после']];
function alterNum(s){
  const m=s.match(/\d+/);if(!m)return null;const n=+m[0];
  const n2=n<=3?n+2:n<=10?n+3:n%10===0?n+10:n+5;
  return s.replace(m[0],String(n2));
}
function genRegQs(items){
  const out=[];const sents=items.flatMap(t=>String(t).split(/(?<=[.!?])\s+/)).map(x=>x.trim()).filter(x=>x.length>=25&&x.length<=220);
  let flip=false;
  sents.forEach(s=>{
    if(out.length>=6)return;
    const hasNum=/\d/.test(s)&&/(мин|час|раз|шт|%|секунд|метр|см|град|сутк|дн)/i.test(s);
    const swap=swapPairs.find(([re])=>re.test(s));
    if(!hasNum&&!swap)return;
    flip=!flip;
    if(flip){out.push({t:'tf',q:s.replace(/[.!]+$/,''),a:true,why:'Верно: '+s,auto:true,on:true});return;}
    let alt=null;
    if(hasNum)alt=alterNum(s);
    if(!alt&&swap)alt=s.replace(swap[0],swap[1]);
    if(alt&&alt!==s)out.push({t:'tf',q:alt.replace(/[.!]+$/,''),a:false,why:'Неверно. В регламенте: '+s,auto:true,on:true});
    else out.push({t:'tf',q:s.replace(/[.!]+$/,''),a:true,why:'Верно: '+s,auto:true,on:true});
  });
  return out;
}

  const keep=()=>{const t=$('#rr');if(t)RG.raw=t.value;};

/* ---------- ЗАЩИТА ОТ ОБМАНА: выходы из приложения во время тестов, блокировка, обжалование, водяной знак ---------- */
const EXIT_MIN_AWAY=3000;
const integ=()=>Object.assign({limit:10,winMin:15,keepDays:30},ORG.integ||{});
let hiddenAt=0,hideCtx=null;
const inTest=()=>(view==='quiz'&&Q&&!Q.game&&Q.i<Q.items.length)?(Q.title||'Тест'):(view==='chat'&&X&&!X.stopped)?(X.title||'Экзамен'):null;
const lockedNow=()=>{const s=myStaff();return !!(s&&(s.disabled||(s.lock&&s.lock.on)));};
const disabledNow=()=>{const s=myStaff();return !!(s&&s.disabled);};
function exitsInWindow(s){const w=integ().winMin*60000,n=Date.now();return (s.exits||[]).filter(e=>n-e.t<=w).length;}
function guardEl(on){const g=document.getElementById('guard');if(g)g.hidden=!on;}
function applyGuard(){
  const s=myStaff();document.body.classList.toggle('guard',!!s);
  let w=document.getElementById('wmk');
  if(!s){if(w)w.remove();return;}
  const tail=String(s.phone||(s.contact&&s.contact.value)||s.code||'').replace(/\D/g,'').slice(-4);
  const txt=(s.name+' '+s.surname+' · '+tail).replace(/[<>&"]/g,'');
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="280" height="180"><text x="14" y="104" transform="rotate(-24 140 90)" fill="#ffffff" fill-opacity="0.08" font-family="sans-serif" font-size="17">'+txt+'</text></svg>';
  if(!w){w=document.createElement('div');w.id='wmk';document.body.appendChild(w);}
  w.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:50;background-image:url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}
function recordExit(s,dur,ctx){
  const now=Date.now(),keep=integ().keepDays*86400000;
  s.exits=(s.exits||[]).filter(e=>now-e.t<keep);s.exits.push({t:now,d:Math.round(dur/1000),c:ctx});
  if(exitsInWindow(s)>integ().limit&&!(s.lock&&s.lock.on)){
    s.lock={on:true,at:now,reason:'exits',n:exitsInWindow(s),appeal:null};s.viol=(s.viol||[]).concat(now);view='locked';
    if(Q&&Q.title===ctx)Q=null;if(X&&X.title===ctx)X=null;
  }
  saveORG();
}
function onHide(){
  if(!isStaff())return;
  guardEl(true);
  if(!hiddenAt){hiddenAt=Date.now();hideCtx=inTest();}
}
function onShow(){
  guardEl(false);
  if(!hiddenAt)return;
  const dur=Date.now()-hiddenAt,ctx=hideCtx;hiddenAt=0;hideCtx=null;
  const s=myStaff();if(!s||!ctx||dur<EXIT_MIN_AWAY)return;
  recordExit(s,dur,ctx);render();
}

function wipeAll(){try{Object.keys(localStorage).filter(k=>/^dfx_/.test(k)).forEach(k=>localStorage.removeItem(k));}catch(e){}}
function renderMgrDel(a){
  const n=ORG.staff.length;
  a.innerHTML=header('Удалить профиль',`<button class="sm ghost" id="dbk">Назад</button>`)+`<div class="stack"><div class="card">
  <p class="lead">Удаление нельзя отменить. Выберите, что удалить.</p>

  <label class="chk"><input type="radio" name="sc" value="all"><span><b>Всё заведение:</b> менеджер, все сотрудники, их прогресс, регламент и добавленные разделы. Приложение станет как новое. Удобно, когда закончили тестирование.</span></label>

  $('#dgo').onclick=()=>{
    const e=m=>{$('#derr').innerHTML='<div class="note err" style="margin-top:8px">'+m+'</div>';};
    if(!ORG.mgr||hashPw($('#dpw').value)!==ORG.mgr.pw)return e('Неверный пароль.');

function renderTerms(a){

  a.innerHTML=header('Условия использования',done?`<button class="sm ghost" id="tbk">Закрыть</button>`:'')+`<div class="stack"><div class="card">${mg?MTERMS:STERMS}

function needRules(){const s=myStaff();return !!(isStaff()&&s&&!s.rules);}

  if(s&&s.lock&&s.lock.on){if(view!=='locked')cur.lockBack=view;view='locked';render();window.scrollTo(0,0);return true;}

  ${ap&&ap.status==='denied'?'<div class="note bad" style="margin-top:8px">Менеджер оставил сдачу закрытой. Подойдите к нему лично.</div>':''}
  ${ap&&ap.status==='pending'?'<div class="note good" style="margin-top:8px">Обращение записано. Отправьте менеджеру скриншот, как описано ниже.</div>':''}
  <div class="note" style="margin-top:10px"><b>Как открыть сдачу</b><ol class="sl"><li>Откройте переключатель приложений (на iPhone: проведите вверх от нижнего края и задержите, либо дважды нажмите «Домой»).</li><li>Сделайте скриншот экрана с открытыми приложениями.</li><li>Отправьте его менеджеру ${mc?'в '+ctName(mc):''} вместе с этим сообщением.</li></ol></div>
  ${ap&&ap.status==='pending'?'':`<label>Что произошло? (по желанию)</label><textarea id="apt" style="min-height:70px" placeholder="Например: отвечал в WhatsApp"></textarea>`}

  <div class="row" style="margin-top:12px"><button class="ghost sm" id="lv2">Выйти</button></div></div></div>`;
  $('#lbk').onclick=()=>{view=(cur.lockBack&&cur.lockBack!=='locked')?cur.lockBack:homeView();render();window.scrollTo(0,0);};
  $('#lv2').onclick=leave;
